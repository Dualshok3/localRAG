[project]
name = "localrag"
version = "0.1.0"
description = "Lokale semantische Suche und RAG über die eigenen Dateien"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "snowballstemmer>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Semantische Suche: großer Download (PyTorch mit CUDA + Embedding-Modell beim ersten Start)
semantic = [
    "torch>=2.7",
    "sentence-transformers>=3.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
localrag = "localrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Texte mit typografischen Zeichen

[tool.pytest.ini_options]
testpaths = ["tests"]
