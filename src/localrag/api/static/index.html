<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalRAG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='13' cy='13' r='8' fill='none' stroke='%232f6fde' stroke-width='3.5'/%3E%3Cpath d='M19 19l8 8' stroke='%232f6fde' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --line: #e2e6eb;
    --accent: #2f6fde; --accent-soft: #e8f0fd; --mark: #fff1a8; --danger: #c0392b; --ok: #1f8a4c;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #94a0b0; --line: #262c35;
      --accent: #6b9cff; --accent-soft: #1c2a44; --mark: #5c4d00; --danger: #ff7b6b; --ok: #4cc685;
      --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--accent); }
  #status { color: var(--muted); font-size: 13px; }
  #status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 background: var(--ok); margin-right: 6px; vertical-align: 1px; }
  form { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  input[type=search] { width: 100%; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button, select { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--text); padding: 0 14px; cursor: pointer; min-height: 44px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.05); }
  button:disabled { opacity: .6; cursor: progress; }
  .options { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 2px 0;
             color: var(--muted); font-size: 13px; }
  .options select { min-height: 32px; padding: 0 8px; font-size: 13px; }
  .chip { border: 1px dashed var(--line); border-radius: 999px; padding: 2px 9px; cursor: pointer;
          font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: transparent;
          color: var(--muted); min-height: 0; }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  #answer { margin-top: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
            padding: 16px 18px; box-shadow: var(--shadow); white-space: pre-wrap; display: none; }
  #answer .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                   margin-bottom: 6px; white-space: normal; }
  #answer a.cite { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px;
                   background: var(--accent-soft); border-radius: 5px; padding: 0 4px; }
  #answer .error { color: var(--danger); }
  #meta { color: var(--muted); font-size: 13px; margin: 18px 2px 8px; min-height: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
          margin-bottom: 10px; box-shadow: var(--shadow); transition: outline-color .3s; outline: 2px solid transparent; }
  .card.flash { outline-color: var(--accent); }
  .card .top { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
  .card .num { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; min-width: 22px; }
  .card .name { font-weight: 600; color: var(--text); text-decoration: none; overflow-wrap: anywhere; cursor: pointer; }
  .card .name:hover { color: var(--accent); text-decoration: underline; }
  .card .where { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .card .folder { color: var(--muted); font-size: 12px; margin: 2px 0 6px 32px; word-break: break-all; }
  .card .snippet { margin-left: 32px; }
  .card mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
  .card .actions { margin: 8px 0 0 32px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .actions button, .card .actions a { min-height: 28px; font-size: 12px; padding: 3px 10px;
    border-radius: 7px; border: 1px solid var(--line); color: var(--muted); text-decoration: none;
    background: transparent; display: inline-flex; align-items: center; }
  .card .actions :is(button, a):hover { color: var(--accent); border-color: var(--accent); }
  .card .dups { margin: 6px 0 0 32px; color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; text-align: center; }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px;
        padding: 0 4px; }
  @media (max-width: 560px) {
    form { grid-template-columns: 1fr 1fr; }
    form input { grid-column: 1 / -1; }
    .card .folder, .card .snippet, .card .actions, .card .dups { margin-left: 0; }
    .card .where { white-space: normal; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Local<span>RAG</span></h1>
    <div id="status">verbinde …</div>
  </header>

  <form id="form" autocomplete="off">
    <input id="q" type="search" placeholder="Suchen oder fragen – z. B. „Kündigungsfrist Mietvertrag“" autofocus
           aria-label="Suchanfrage">
    <button class="primary" type="submit" id="search-btn">Suchen</button>
    <button type="button" id="ask-btn" title="Antwort mit Quellen vom lokalen Sprachmodell (Strg+Enter)">Fragen</button>
  </form>
  <div class="options">
    <label>Modus
      <select id="mode">
        <option value="auto">Automatisch</option>
        <option value="keyword">Stichwort</option>
        <option value="semantic">Bedeutung</option>
        <option value="hybrid">Hybrid</option>
      </select>
    </label>
    <span>Filter:</span>
    <button type="button" class="chip" data-insert="type:pdf">type:pdf</button>
    <button type="button" class="chip" data-insert="in:">in:Ordner</button>
    <button type="button" class="chip" data-insert="-in:">-in:Ordner</button>
    <button type="button" class="chip" data-insert="after:2024">after:2024</button>
    <button type="button" class="chip" data-insert="before:2024-07">before:2024-07</button>
  </div>

  <section id="answer" aria-live="polite"></section>
  <div id="meta"></div>
  <section id="results"></section>

  <footer>Alles bleibt auf diesem Rechner. <kbd>/</kbd> Suchfeld · <kbd>Enter</kbd> suchen ·
    <kbd>Strg</kbd>+<kbd>Enter</kbd> fragen</footer>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const q = $("q"), mode = $("mode"), results = $("results"), meta = $("meta"), answer = $("answer");
let running = null;  // AbortController der laufenden Anfrage

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const c of children) if (c != null) node.append(c);
  return node;
}

function fileName(path) { return path.split(/[\\/]/).pop(); }
function folderOf(path) { const parts = path.split(/[\\/]/); parts.pop(); return parts.join("\\"); }

// Treffer-Wörter markieren – ohne HTML-Einfügen, Dateiinhalte sind fremder Text
function highlighted(text, words) {
  const frag = document.createDocumentFragment();
  const clean = (words || []).filter(w => w && w.length > 1)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!clean.length) { frag.append(text); return frag; }
  const re = new RegExp("(" + clean.join("|") + ")", "giu");
  let last = 0;
  for (const m of text.matchAll(re)) {
    frag.append(text.slice(last, m.index), el("mark", {}, m[0]));
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last));
  return frag;
}

async function openFile(documentId, reveal) {
  const resp = await fetch("/open", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-LocalRAG": "1" },
    body: JSON.stringify({ document_id: documentId, reveal }),
  });
  if (!resp.ok) meta.textContent = (await resp.json()).detail || "Öffnen fehlgeschlagen";
}

function card(hit, n) {
  const unit = hit.filetype === "pptx" ? "Folie" : "Seite";
  const where = hit.page ? `${unit} ${hit.page}` : (hit.heading_path || "");
  const actions = el("div", { class: "actions" },
    el("button", { type: "button", onclick: () => openFile(hit.document_id, false) }, "Öffnen"),
    el("button", { type: "button", onclick: () => openFile(hit.document_id, true) }, "Im Ordner zeigen"),
  );
  if (hit.filetype === "pdf") {
    actions.append(el("a", { href: `/file/${hit.document_id}#page=${hit.page || 1}`, target: "_blank",
                              rel: "noopener" }, hit.page ? `Im Browser, Seite ${hit.page}` : "Im Browser"));
  }
  const dups = hit.duplicates && hit.duplicates.length
    ? el("div", { class: "dups" }, "Gleicher Inhalt auch in: " +
         hit.duplicates.slice(0, 3).map(fileName).join(", ") +
         (hit.duplicates.length > 3 ? ` und ${hit.duplicates.length - 3} weiteren` : ""))
    : null;
  return el("article", { class: "card", id: `src-${n}` },
    el("div", { class: "top" },
      el("span", { class: "num" }, `${n}.`),
      el("a", { class: "name", title: "Mit dem Standardprogramm öffnen", role: "button", tabindex: "0",
                onclick: () => openFile(hit.document_id, false),
                onkeydown: (e) => { if (e.key === "Enter") openFile(hit.document_id, false); } },
         fileName(hit.path)),
      where ? el("span", { class: "where" }, "· " + where) : null),
    el("div", { class: "folder" }, folderOf(hit.path)),
    el("div", { class: "snippet" }, highlighted(hit.snippet, hit.matched_words)),
    actions, dups);
}

function showHits(hits) {
  results.replaceChildren(...hits.map((h, i) => card(h, i + 1)));
  if (!hits.length) results.replaceChildren(el("div", { class: "empty" }, "Keine Treffer."));
}

function begin(kind) {
  if (running) running.abort();
  running = new AbortController();
  const url = new URL(location);
  url.searchParams.set("q", q.value);
  if (kind === "ask") url.searchParams.set("ask", "1"); else url.searchParams.delete("ask");
  history.replaceState(null, "", url);
  $("search-btn").disabled = $("ask-btn").disabled = true;
  return running.signal;
}
function end() { $("search-btn").disabled = $("ask-btn").disabled = false; }

async function runSearch() {
  const query = q.value.trim();
  if (!query) return;
  const signal = begin("search");
  answer.style.display = "none";
  meta.textContent = "Suche …";
  try {
    const params = new URLSearchParams({ q: query, mode: mode.value, limit: "20" });
    const resp = await fetch("/search?" + params, { signal });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.detail || resp.statusText);
    showHits(data.hits);
    meta.textContent = `${data.hits.length} Treffer in ${Math.round(data.took_ms)} ms · ${data.mode}`;
  } catch (e) {
    if (e.name !== "AbortError") meta.textContent = "Fehler: " + e.message;
  } finally { end(); }
}

function renderAnswer(text) {
  // [n] → Sprung zur Quelle n
  const frag = document.createDocumentFragment();
  let last = 0;
  for (const m of text.matchAll(/\[(\d{1,2})\]/g)) {
    frag.append(text.slice(last, m.index));
    const n = m[1];
    frag.append(el("a", { class: "cite", href: `#src-${n}`, onclick: (e) => {
      e.preventDefault();
      const target = $(`src-${n}`);
      if (!target) return;
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      target.classList.add("flash");
      setTimeout(() => target.classList.remove("flash"), 1200);
    } }, m[0]));
    last = m.index + m[0].length;
  }
  frag.append(text.slice(last));
  return frag;
}

async function runAsk() {
  const question = q.value.trim();
  if (!question) return;
  const signal = begin("ask");
  const label = el("div", { class: "label" }, "Antwort");
  const body = el("div", {}, "Suche passende Stellen …");
  answer.replaceChildren(label, body);
  answer.style.display = "block";
  results.replaceChildren();
  meta.textContent = "";
  let text = "", searchMs = 0, model = "";
  const started = performance.now();
  try {
    const resp = await fetch("/ask", {
      method: "POST", signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, mode: mode.value, k: 6 }),
    });
    if (!resp.ok) throw new Error((await resp.json()).detail || resp.statusText);
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let nl;
      while ((nl = buffer.indexOf("\n")) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "sources") {
          searchMs = ev.search_ms;
          showHits(ev.sources);
          body.textContent = ev.sources.length ? "Das Modell liest die Quellen …" : "";
          meta.textContent = `Quellen (${ev.sources.length})`;
        } else if (ev.type === "model") {
          model = ev.model || "";
          if (model) label.textContent = `Antwort · ${model}`;
        } else if (ev.type === "token") {
          text += ev.text;
          body.replaceChildren(renderAnswer(text));
        } else if (ev.type === "error") {
          body.replaceChildren(el("span", { class: "error" }, ev.message));
        } else if (ev.type === "done") {
          const secs = ((performance.now() - started) / 1000).toFixed(1);
          meta.textContent = `Quellen · Suche ${Math.round(searchMs)} ms · Antwort ${secs} s` +
            (ev.cited && ev.cited.length ? ` · zitiert: ${ev.cited.map(n => "[" + n + "]").join(" ")}` : "");
        }
      }
    }
  } catch (e) {
    if (e.name !== "AbortError") body.replaceChildren(el("span", { class: "error" }, "Fehler: " + e.message));
  } finally { end(); }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); runSearch(); });
$("ask-btn").addEventListener("click", runAsk);
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runAsk(); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
});
for (const chip of document.querySelectorAll(".chip")) {
  chip.addEventListener("click", () => {
    const v = q.value.trimEnd();
    q.value = (v ? v + " " : "") + chip.dataset.insert;
    q.focus();
    q.setSelectionRange(q.value.length, q.value.length);
  });
}

(async function init() {
  try {
    const [health, stats] = await Promise.all([fetch("/health").then(r => r.json()),
                                               fetch("/stats").then(r => r.json())]);
    const bits = [`${stats.documents.toLocaleString("de-DE")} Dateien`,
                  `${stats.chunks.toLocaleString("de-DE")} Abschnitte`,
                  health.embedding_model ? health.embedding_model.split("/").pop() : "nur Stichwortsuche"];
    if (health.reranker) bits.push("Reranker");
    if (health.watching) bits.push("beobachtet " + health.watching.length + " Ordner");
    $("status").replaceChildren(el("span", { class: "dot" }), bits.join(" · "));
  } catch { $("status").textContent = "Dienst nicht erreichbar"; }
  const params = new URLSearchParams(location.search);
  if (params.get("q")) {
    q.value = params.get("q");
    params.get("ask") ? runAsk() : runSearch();
  }
})();
</script>
</body>
</html>
