[project]
name = "localrag"
version = "0.1.0"
description = "Lokale semantische Suche und RAG über die eigenen Dateien"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "snowballstemmer>=2.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
localrag = "localrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localrag"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # deutsche Texte mit typografischen Zeichen

[tool.pytest.ini_options]
testpaths = ["tests"]
