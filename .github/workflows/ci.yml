name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # manuell starten → gitleaks prüft dann die komplette Historie

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      # CI ohne PyTorch: BM25-Eval als Regressionstest, Vektor-Logik über Tests mit Fake-Embedder
      - run: uv run python eval/run_eval.py --modes keyword --min-recall-at-5 0.5

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
